# yaml-language-server: $schema=https://agentgateway.dev/schema/config
frontendPolicies:
  http:
    maxBufferSize: 33554432
  accessLog:
    database:
      llm: full
config:
  tracing:
    otlpEndpoint: http://localhost:4317
    randomSampling: true
  database:
    url: sqlite://./data.db?mode=rwc
  modelCatalog:
  - file: ./gateway/base-costs.json
llm:
  port: 3000
  models:
  - name: director-primary
    visibility: internal
    provider: gemini
    params:
      model: gemini-3.6-flash
      apiKey: $GEMINI_API_KEY
    health:
      eviction:
        consecutiveFailures: 2
        duration: 30s
  - name: director-fallback
    visibility: internal
    provider: openAI
    params:
      model: gpt-4o
      apiKey: $OPENAI_API_KEY
    health:
      eviction:
        consecutiveFailures: 2
        duration: 30s
  - name: nano-banana
    visibility: public
    provider: gemini
    params:
      model: gemini-2.5-flash-image
      apiKey: $GEMINI_API_KEY
  - name: gemini-2.5-flash-image
    visibility: public
    provider: gemini
    params:
      model: gemini-2.5-flash-image
      apiKey: $GEMINI_API_KEY
  virtualModels:
  - name: director
    routing:
      failover:
        targets:
        - model: director-primary
          priority: 0
        - model: director-fallback
          priority: 1
  policies:
    apiKey:
      mode: strict
      keys:
      - keyHash: sha256:2a496f3cc41dbc19edf5213901c31f2aba2f68028fe28d991317a412ce10d616
        metadata:
          name: director
        budgets:
        - name: daily-spend
          limit:
            unit: USD
            amount: 10
          window:
            rolling: 24h
          onBudgetExceeded: Block
        - name: tripwire
          limit:
            unit: Tokens
            amount: 200000
          window:
            rolling: 24h
          onBudgetExceeded: Block
    cors:
      allowOrigins:
      - http://localhost:15000
      allowHeaders:
      - '*'
      allowMethods:
      - GET
      - POST
mcp:
  port: 3001
  failureMode: failOpen
  targets:
  - name: camera
    stdio:
      cmd: python
      args:
      - -m
      - servers.camera_mcp
  - name: stage
    stdio:
      cmd: python
      args:
      - -m
      - servers.stage_mcp
  - name: post
    stdio:
      cmd: python
      args:
      - -m
      - servers.post_mcp
  - name: publish
    stdio:
      cmd: python
      args:
      - -m
      - servers.publish_mcp
      # The point of the whole exercise: this process is spawned by
      # agentgateway, so by default it INHERITS the gateway's environment --
      # including GITHUB_TOKEN. clearEnv wipes it and env lists back only what
      # publishing actually needs. There is no credential here to leak.
      # PATH must be listed explicitly or `cmd: python` will not resolve, and
      # it has to start with the venv or the server loses fastmcp/requests.
      # up.sh exports VENV_BIN for this. (The field is clear_env, snake_case --
      # the only one in this file that is not camelCase.)
      clear_env: true
      env:
        PATH: ${VENV_BIN:-./.venv/bin}:/usr/bin:/bin
        HOME: /tmp
        GITHUB_REPO: $GITHUB_REPO
        GITHUB_RELEASE_TAG: $GITHUB_RELEASE_TAG
        # One port, two prefixes. The route strips the prefix before it
        # leaves, so /api/user arrives at api.github.com as /user.
        AGW_VIRTUAL_KEY: $AGW_VIRTUAL_KEY
        GITHUB_API: http://localhost:3004/api
        GITHUB_UPLOADS: http://localhost:3004/uploads
  - name: vision
    mcp:
      host: http://localhost:8000/mcp
  policies:
    # ---- MCP authentication + authorization (Keycloak) ------------------
    # A PERSON authorizes the one tool that acts in the real world: publish.
    # Everything else -- camera, stage, credits, the film itself -- is
    # ungated, so the show is not an auth demo. This is agentgateway's MCP
    # auth feature, not the apiKey policy: the gateway validates a real JWT
    # from Keycloak and can reason about its claims.
    #
    # provider: keycloak is first-class in agentgateway -- it derives the
    # (non-standard) JWKS path, serves protected-resource metadata, and
    # returns 401 + WWW-Authenticate so an MCP client can discover where to
    # log in. The gateway fetches the JWKS while LOADING this file, so
    # Keycloak must be up or the config is rejected (the running gateway
    # keeps its old config; it does not die). ./imagine preflight checks it.
    #
    # audiences: publish-mcp-server -- the aud the realm's mcp:tools client
    # scope mints. mode: optional so an unauthenticated call is not rejected
    # at the door; the authorization rule below is what refuses it, and only
    # for the publish target.
    # >>> mcp-auth  (toggle with ./imagine auth on|off -- do not hand-edit)
    mcpAuthentication:
      mode: optional
      issuer: http://localhost:8080/realms/my-realm
      audiences:
      - publish-mcp-server
      provider:
        keycloak: {}
      resourceMetadata:
        resource: http://localhost:3001/mcp
        scopesSupported:
        - openid
        bearerMethodsSupported:
        - header
    mcpAuthorization:
      # Denylist: everything is allowed except a publish call with no
      # authenticated subject. mcp.tool.target is the `name:` of a target
      # above. To require a group instead of merely a login, change to:
      #   deny: 'mcp.tool.target == "publish" && !("publishers" in jwt.groups)'
      rules:
      - deny: 'mcp.tool.target == "publish" && !has(jwt.sub)'
    # <<< mcp-auth
    cors:
      allowOrigins:
      - http://localhost:15000
      allowHeaders:
      - '*'
      allowMethods:
      - GET
      - POST
      exposeHeaders:
      - Mcp-Session-Id
gateways:
  scout-gw:
    port: 3002
  dp-gw:
    port: 3003
  # GitHub: ONE port, two routes. Release assets go to uploads.github.com and
  # everything else to api.github.com -- two different services, so they are
  # two routes selected by path prefix, not two backends on one route (that
  # would load-balance between them) and not two hosts on one backend (same).
  github-gw:
    port: 3004
routes:
- name: scout
  gateways:
  - scout-gw
  policies:
    a2a: {}
  backends:
  - host: localhost:9101
- name: dp
  gateways:
  - dp-gw
  policies:
    a2a: {}
  backends:
  - host: localhost:9102
# The gateway holds the GitHub credential and stamps it on the way out, so the
# publish MCP server sends none. backendAuth's default location is
# `Authorization: Bearer <value>`, which is exactly what GitHub wants, and it
# OVERWRITES whatever the caller sent. backendTLS is required: without it the
# upstream hop is plain HTTP and github answers 301 to https.
- name: github-api
  gateways:
  - github-gw
  matches:
  - path:
      pathPrefix: /api
  policies:
    # INBOUND guard. Without this, anything on this laptop that can reach :3004
    # can act as you on GitHub -- the gateway would hand it the token. Same
    # virtual key the agents already use for the LLM listener, so there is one
    # identity concept in the demo rather than two, and no new service that can
    # be down when you walk on stage.
    #
    # Note the shape of the hop: the caller proves WHO it is with the virtual
    # key; the gateway then replaces that header entirely with the GitHub
    # credential on the way out. Inbound identity and outbound credential are
    # different things, and neither side ever holds the other's.
    apiKey:
      mode: strict
      keys:
      - keyHash: sha256:2a496f3cc41dbc19edf5213901c31f2aba2f68028fe28d991317a412ce10d616
        metadata:
          name: publish
    urlRewrite:
      path:
        prefix: /
  backends:
  - host: api.github.com:443
    policies:
      backendAuth:
        key:
          value: $GITHUB_TOKEN
      backendTLS: {}
- name: github-uploads
  gateways:
  - github-gw
  matches:
  - path:
      pathPrefix: /uploads
  policies:
    # INBOUND guard. Without this, anything on this laptop that can reach :3004
    # can act as you on GitHub -- the gateway would hand it the token. Same
    # virtual key the agents already use for the LLM listener, so there is one
    # identity concept in the demo rather than two, and no new service that can
    # be down when you walk on stage.
    #
    # Note the shape of the hop: the caller proves WHO it is with the virtual
    # key; the gateway then replaces that header entirely with the GitHub
    # credential on the way out. Inbound identity and outbound credential are
    # different things, and neither side ever holds the other's.
    apiKey:
      mode: strict
      keys:
      - keyHash: sha256:2a496f3cc41dbc19edf5213901c31f2aba2f68028fe28d991317a412ce10d616
        metadata:
          name: publish
    urlRewrite:
      path:
        prefix: /
  backends:
  - host: uploads.github.com:443
    policies:
      backendAuth:
        key:
          value: $GITHUB_TOKEN
      backendTLS: {}
