# :3006, what the studio page calls. The page itself is on :3007, served by
# `kubectl ate proxy actor studio` (scripts/k8s-pf.sh) through atenet-router,
# which wakes the actor; this gateway can't reach the router, which on Substrate
# v1 takes only mTLS clients on its allowlist. So the page calls a second
# origin, and this port allows it with CORS:
#
#   /photo/...   the photo inbox   -> viewfinder (/latest, /latest.jpg, /upload)
#   /stage/...   the projector     -> viewfinder (/stage/state, /stage/media)
#   /director/   the Director      -> kagent (in ../agents/agents.yaml)
#
# Only port-forwarded to 127.0.0.1 (scripts/k8s-pf.sh), so these routes carry
# no inbox key: the page is for the laptop on stage, not the venue wifi.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: studio
  namespace: default
spec:
  parentRefs:
  - {name: agentgateway, sectionName: studio-api}
  rules:
  - matches: [{path: {type: PathPrefix, value: /photo/}}]
    filters:
    - type: URLRewrite
      urlRewrite:
        path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
    backendRefs:
    - {name: viewfinder, port: 8888}
  - matches: [{path: {type: PathPrefix, value: /stage/}}]
    backendRefs:
    - {name: viewfinder, port: 8888}
---
# The page's origin may call :3006. Authorization carries the publish sign-in;
# A2A-Version and Accept go with each Director call; Content-Type with a JSON
# call or a photo upload.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: studio-cors
  namespace: default
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: Gateway, name: agentgateway, sectionName: studio-api}
  traffic:
    cors:
      allowOrigins: ["http://localhost:3007", "http://127.0.0.1:3007"]
      allowHeaders: [Authorization, Content-Type, Accept, A2A-Version]
      allowMethods: [GET, POST]
      maxAge: 600
