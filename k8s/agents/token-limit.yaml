apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm-token-limit
  namespace: default
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: Gateway, name: agentgateway, sectionName: llm}
  traffic:
    rateLimit:
      local:
      - tokens: 2000000
        unit: Hours
        key: apiKey.name
