# The three agents, as kagent Agents. All three use the one BYO Harness
# (harness.yaml: image, command, env, worker pool) with an inline template;
# the Agent's name tells the runtime which agent it is.
# The template is just the description: the agents bring their own prompts,
# models and tools, all of them behind agentgateway, so there is no
# modelConfig and no MCP tool list here.
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: director
  namespace: default
spec:
  harnessRef: {name: imagine}
  template:
    inline:
      description: >-
        The Director: turns a photo into a short film.
  egressPolicyRefs:
  - name: imagine-agents
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: scout
  namespace: default
spec:
  harnessRef: {name: imagine}
  template:
    inline:
      description: Enriches the idea into vivid visual wording.
  egressPolicyRefs:
  - name: imagine-agents
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: dp
  namespace: default
spec:
  harnessRef: {name: imagine}
  template:
    inline:
      description: Director of Photography.
  egressPolicyRefs:
  - name: imagine-agents
