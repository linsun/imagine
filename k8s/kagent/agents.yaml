# The three agents, as kagent Agents. Each one pairs a BYO Harness
# (harnesses.yaml: image, command, env, worker pool) with an inline template.
# The template is just the description: the agents bring their own prompts,
# models and tools, all of them behind agentgateway, so there is no
# modelConfig and no MCP tool list here.
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: director
  namespace: default
spec:
  harnessRef: {name: imagine-director}
  template:
    inline:
      description: >-
        The Director: turns a photo of the room into a short film, with a
        Location Scout and a Director of Photography as crew.
  egressPolicyRefs:
  - name: imagine-agents
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: scout
  namespace: default
spec:
  harnessRef: {name: imagine-scout}
  template:
    inline:
      description: Location Scout for the keynote film crew. Enriches the idea into vivid visual wording.
  egressPolicyRefs:
  - name: imagine-agents
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: dp
  namespace: default
spec:
  harnessRef: {name: imagine-dp}
  template:
    inline:
      description: Director of Photography for the keynote film crew. Gives the motion and music direction.
  egressPolicyRefs:
  - name: imagine-agents
