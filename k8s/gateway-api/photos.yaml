# :3005 -- the photo inbox. The phone (or a drone, via the phone) posts here
# over the venue wifi. Uploading and viewing need the inbox key; the page
# itself is just HTML and carries the key in its URL fragment.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: photo-upload
  namespace: default
spec:
  parentRefs:
  - {name: agentgateway, sectionName: photos}
  rules:
  - matches:
    - path: {type: PathPrefix, value: /upload}
    - path: {type: PathPrefix, value: /latest}
    backendRefs:
    - {name: viewfinder, port: 8888}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: photo-inbox-page
  namespace: default
spec:
  parentRefs:
  - {name: agentgateway, sectionName: photos}
  rules:
  - matches:
    - path: {type: Exact, value: /inbox}
    backendRefs:
    - {name: viewfinder, port: 8888}
---
# PHOTO_INBOX_KEY, hashed (Secret `photo-inbox-key`, created by scripts/k8s-up.sh).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: photo-upload-access
  namespace: default
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: photo-upload}
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef: {name: photo-inbox-key}
